schema_version: 1
robots:
- robot_1
- robot_2
startup_timeout_wall_s: 300.0
experiment_timeout_wall_s: 600.0
stages:
- name: settle_and_observe
  duration_s: 8.0
  commands:
    robot_1:
      kind: hold
      speed: 0.0
      acceleration: 0.8
    robot_2:
      kind: hold
      speed: 0.0
      acceleration: 0.8
- name: playful_13_slow_pass
  duration_s: 28.0
  commands:
    robot_1:
      kind: point
      speed: 0.1
      acceleration: 0.8
      point:
      - 13.0
      - 5.0
    robot_2:
      kind: hold
      speed: 0.0
      acceleration: 0.8
- name: transfer_toward_crowd
  duration_s: 8.0
  commands:
    robot_1:
      kind: point
      speed: 0.5
      acceleration: 0.8
      point:
      - 17.0
      - 6.0
    robot_2:
      kind: point
      speed: 0.4
      acceleration: 0.8
      point:
      - 13.0
      - 15.0
- name: playful_14_and_curious_crowd
  duration_s: 18.0
  commands:
    robot_1:
      kind: follow
      speed: 0.12
      acceleration: 0.4
      person: person_1
      target_gap: 1.2
    robot_2:
      kind: point
      speed: 0.1
      acceleration: 0.8
      point:
      - 18.0
      - 15.0
- name: sudden_directed_approach
  duration_s: 6.0
  commands:
    robot_1:
      kind: follow
      speed: 0.9
      acceleration: 1.5
      person: person_1
      target_gap: 0.0
    robot_2:
      kind: follow
      speed: 0.9
      acceleration: 1.5
      person: person_14
      target_gap: 0.0
- name: stop_after_approach
  duration_s: 5.0
  commands:
    robot_1:
      kind: hold
      speed: 0.0
      acceleration: 0.8
    robot_2:
      kind: hold
      speed: 0.0
      acceleration: 0.8
- name: withdraw_and_recover
  duration_s: 12.0
  commands:
    robot_1:
      kind: point
      speed: 0.6
      acceleration: 0.8
      point:
      - 10.0
      - 2.0
    robot_2:
      kind: point
      speed: 0.6
      acceleration: 0.8
      point:
      - 10.0
      - 21.0
- name: immune_and_static_pass
  duration_s: 24.0
  commands:
    robot_1:
      kind: point
      speed: 0.4
      acceleration: 0.8
      point:
      - 22.0
      - 3.5
    robot_2:
      kind: point
      speed: 0.4
      acceleration: 0.8
      point:
      - 27.0
      - 19.5
- name: recovery_and_task_return
  duration_s: 25.0
  commands:
    robot_1:
      kind: hold
      speed: 0.0
      acceleration: 0.8
    robot_2:
      kind: hold
      speed: 0.0
      acceleration: 0.8
