perception_condition:
  id: psychology.robot_fov_deg
  participant_id: 1
  value: 360.0
  unit: degrees total psychological robot FOV
  calibration_status: unfitted
  source: experimental sustained attention assumption; not a measured human FOV
  physical_sfm_fov_deg: 200.0
  limitation: No independent head gaze; this condition removes loss of threat perception
    when the body turns away. Default-200-degree negative runs retained.
motion_condition:
  base_desired_speed_mps:
    1_to_4: 0.3
    5_to_6: 0.4
  hard_person_speed_mps: 1.0
  source: experimental slow walking routes; not fitted locomotion parameters
watchdogs:
  stimulus_status_timeout_wall_s: 2.0
  stimulus_wall_freshness_s: 0.6
  stimulus_max_sim_age_s: 0.25
  stimulus_max_sim_step_s: 0.25
  robot_guard: existing unchanged command_guard and pedestrian health gates
acceptance:
  actual_min_robot_gap_m: 0.1
  actual_min_human_gap_m: 0.0
  max_display_error_m: 0.25
  core_max_speed_mps: 1.0
  core_max_acceleration_mps2: 3.0
  focal_peak_fear_min: 0.65
  fear_triggered_scared_s_min: 0.5
  actual_outward_s_min: 0.5
  actual_outward_distance_m_min: 0.1
  task_resumed_samples_min: 20
  category: engineering_validation_not_fitting
